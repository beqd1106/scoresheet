workflows:
  ios-testflight:
    name: スコアシート TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4
      vars:
        BUNDLE_ID: "com.beqd1106.scoresheet"
        XCODE_PROJECT: "ScoreSheet.xcodeproj"
        XCODE_SCHEME: "ScoreSheet"
      # Codemagic の UI で登録した App Store Connect API キー（integration名: scoresheet_asc）を参照
    integrations:
      app_store_connect: scoresheet_asc
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.beqd1106.scoresheet
    triggering:
      events:
        - tag         # v1.0.0 のようなタグ push で配布ビルド
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: XcodeGen でプロジェクト生成（ビルド番号を自動採番）
        script: |
          set -e
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          # Codemagic の $BUILD_NUMBER（自動増加）を CFBundleVersion に反映
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
      - name: 署名プロファイルを適用
        script: |
          xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 社内テスターへ自動配布したい場合は下記を有効化（グループ名は ASC で作成しておく）
        # beta_groups:
        #   - スコアシート内部テスト
      email:
        recipients:
          - beqd1106@gmail.com
        notify:
          success: true
          failure: true
