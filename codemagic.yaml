workflows:
  ios-testflight:
    name: スコアシート TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # カチカン等で登録済みの既存 App Store Connect API キー（チームキー）を流用。
      # チームキーは同一チームの全アプリで共通のため新規発行不要。
      app_store_connect: AppStoreConnect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.beqd1106.scoresheet
      vars:
        XCODE_PROJECT: "ScoreSheet.xcodeproj"
        XCODE_SCHEME: "ScoreSheet"
      xcode: 16.4
    triggering:
      events:
        - tag         # v1.0.0 のようなタグ push で配布ビルド
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: XcodeGen でプロジェクト生成（ビルド番号を自動採番）
        script: |
          set -e
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          # Codemagic の $BUILD_NUMBER（自動増加）を CFBundleVersion に反映
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          xcodegen generate
      - name: 署名プロファイルを適用
        script: |
          xcode-project use-profiles
      - name: IPA をビルド
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - beqd1106@gmail.com
        notify:
          success: true
          failure: true
