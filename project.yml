name: ScoreSheet
options:
  bundleIdPrefix: com.beqd1106
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: スコアシート
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ScoreSheet:
    type: application
    platform: iOS
    sources:
      - path: ScoreSheet
    # v1 はローカル保存のみ（特別な entitlements なし）。iCloud は v1.1 で再導入予定。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone専用を「ターゲットレベル」で明示（project-level指定だけではarchiveに効かず
        # ビルドがUniversal扱いになり、App StoreがiPad(13")スクショを要求したため）。
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone専用・縦のみ。iPadは非対応にしたので iPad 向き宣言は不要（削除）。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    scheme:
      testTargets:
        - ScoreSheetTests

  ScoreSheetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScoreSheetTests
    dependencies:
      - target: ScoreSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet.tests
        GENERATE_INFOPLIST_FILE: YES
