name: ScoreSheet
options:
  bundleIdPrefix: com.beqd1106
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: スコアシート
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ScoreSheet:
    type: application
    platform: iOS
    sources:
      - path: ScoreSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    scheme:
      testTargets:
        - ScoreSheetTests

  ScoreSheetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScoreSheetTests
    dependencies:
      - target: ScoreSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet.tests
        GENERATE_INFOPLIST_FILE: YES
