name: ScoreSheet
options:
  bundleIdPrefix: com.beqd1106
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: スコアシート
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ScoreSheet:
    type: application
    platform: iOS
    sources:
      - path: ScoreSheet
    # iCloud(CloudKit) 同期用の entitlements を生成。
    entitlements:
      path: ScoreSheet/ScoreSheet.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.beqd1106.scoresheet
        com.apple.developer.icloud-services:
          - CloudKit
        # TestFlight/配布ビルドでも CloudKit の Development 環境を使う。
        # → Mac なしでも初回起動時にスキーマが自動生成され、Production への手動反映が不要。
        # ※ 一般公開(App Store)時は Production に切替＋スキーマを本番Deployすること。
        com.apple.developer.icloud-container-environment: Development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone は縦のみ。iPad は App Store 検証(90474)を満たすため4方向を宣言。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    scheme:
      testTargets:
        - ScoreSheetTests

  ScoreSheetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScoreSheetTests
    dependencies:
      - target: ScoreSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beqd1106.scoresheet.tests
        GENERATE_INFOPLIST_FILE: YES
